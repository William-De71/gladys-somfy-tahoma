<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Architecture of the Somfy TaHoma integration for Gladys Assistant (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="980" y="532" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>

  <!-- Gladys -->
  <rect x="20" y="40" width="220" height="330" rx="14" fill="#eef4fb" stroke="#2979d6" stroke-width="2"/>
  <text x="130" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4f8c">Gladys Assistant</text>
  <g font-size="14" fill="#24303c">
    <rect x="36" y="90" width="188" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="130" y="114" text-anchor="middle">Covers, lights, sensors</text>
    <rect x="36" y="138" width="188" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="130" y="162" text-anchor="middle">Badges local / cloud</text>
    <rect x="36" y="186" width="188" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="130" y="210" text-anchor="middle">Scenes: triggers, actions</text>
    <rect x="36" y="234" width="188" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="130" y="258" text-anchor="middle" font-size="13">Widgets: cover, box, scenarios</text>
    <rect x="36" y="282" width="188" height="58" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="130" y="306" text-anchor="middle">mDNS scan</text>
    <text x="130" y="326" text-anchor="middle">_kizboxdev._tcp</text>
  </g>

  <!-- Link Gladys / container -->
  <line x1="246" y1="205" x2="334" y2="205" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="178" text-anchor="middle" font-size="12" fill="#46505a">REST</text>
  <text x="290" y="193" text-anchor="middle" font-size="10.5" fill="#46505a">/api/integration/v1</text>
  <text x="290" y="226" text-anchor="middle" font-size="12" fill="#46505a">+ WebSocket</text>

  <!-- Container -->
  <rect x="340" y="40" width="270" height="330" rx="14" fill="#f3f0fb" stroke="#6d4fc2" stroke-width="2"/>
  <text x="475" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#4b3196">Integration container</text>
  <g font-size="14" fill="#24303c" text-anchor="middle">
    <text x="475" y="102">Node.js + Gladys SDK</text>
    <rect x="356" y="116" width="238" height="58" rx="8" fill="#ffffff" stroke="#cfc4ee"/>
    <text x="475" y="140">src/box.js: channel, fallback,</text>
    <text x="475" y="160">event listener, resync</text>
    <rect x="356" y="184" width="238" height="58" rx="8" fill="#ffffff" stroke="#cfc4ee"/>
    <text x="475" y="208">src/overkiz/: Overkiz API,</text>
    <text x="475" y="228">Overkiz root CA, models</text>
    <rect x="356" y="252" width="238" height="58" rx="8" fill="#ffffff" stroke="#cfc4ee"/>
    <text x="475" y="276">/data: box address, scenarios,</text>
    <text x="475" y="296">local token made by Gladys</text>
    <text x="475" y="338" font-size="12" fill="#5d5470">read-only rootfs, 256 MB, non-root</text>
  </g>

  <!-- Local channel -->
  <line x1="616" y1="120" x2="704" y2="120" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="100" text-anchor="middle" font-size="12" fill="#2f7a3a">HTTPS :8443</text>
  <text x="660" y="142" text-anchor="middle" font-size="12" fill="#2f7a3a">local first</text>

  <!-- Cloud channel -->
  <line x1="616" y1="300" x2="704" y2="300" stroke="#c77700" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="660" y="280" text-anchor="middle" font-size="12" fill="#9a5c00">HTTPS</text>
  <text x="660" y="322" text-anchor="middle" font-size="12" fill="#9a5c00">fallback</text>

  <!-- Box -->
  <rect x="710" y="40" width="270" height="150" rx="14" fill="#eaf7ee" stroke="#2f9e44" stroke-width="2"/>
  <text x="845" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#22693a">TaHoma box</text>
  <g font-size="13" fill="#24303c" text-anchor="middle">
    <text x="845" y="94">TaHoma, TaHoma Switch, Connexoon</text>
    <text x="845" y="116">Developer Mode: local API,</text>
    <text x="845" y="136">Bearer token, Overkiz certificate</text>
    <text x="845" y="160">events pushed to the listener</text>
    <text x="845" y="178">(fetched every 2 s)</text>
  </g>

  <!-- Cloud -->
  <rect x="710" y="240" width="270" height="130" rx="14" fill="#fff5e6" stroke="#c77700" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="845" y="268" text-anchor="middle" font-size="19" font-weight="700" fill="#8a5300">Somfy cloud</text>
  <g font-size="13" fill="#24303c" text-anchor="middle">
    <text x="845" y="292">accounts.somfy.com (login)</text>
    <text x="845" y="312">ha101-1.overkiz.com (Europe)</text>
    <text x="845" y="332">TaHoma scenarios, local token</text>
    <text x="845" y="352">events fetched every 30 s</text>
  </g>
  <line x1="845" y1="236" x2="845" y2="196" stroke="#8a949e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="852" y="222" font-size="11" fill="#6b7580">the box's own link</text>

  <!-- Radio -->
  <rect x="160" y="420" width="680" height="80" rx="14" fill="#f6f7f9" stroke="#8a949e" stroke-width="1.5"/>
  <text x="500" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#24303c">Devices of the box: io-homecontrol, RTS, Zigbee…</text>
  <text x="500" y="476" text-anchor="middle" font-size="13" fill="#46505a">roller shutters, blinds, screens, awnings, curtains, windows, garage doors, gates, lights, plugs, sensors</text>
  <line x1="845" y1="194" x2="845" y2="200" stroke="#ffffff"/>
  <path d="M 980 115 C 1000 115, 1000 460, 846 460" fill="none" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="992" y="300" font-size="12" fill="#2f7a3a" text-anchor="end" transform="rotate(90 992 300)">radio</text>
</svg>
