<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>From the scan to the command: sequence of the Somfy TaHoma integration (illustration)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="596" fill="#ffffff"/>
  <text x="980" y="588" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#24303c">
    <rect x="30" y="20" width="120" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="90" y="44">User</text>
    <rect x="230" y="20" width="120" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="290" y="44">Gladys</text>
    <rect x="430" y="20" width="140" height="36" rx="8" fill="#f3f0fb" stroke="#6d4fc2"/><text x="500" y="44">Integration</text>
    <rect x="650" y="20" width="140" height="36" rx="8" fill="#eaf7ee" stroke="#2f9e44"/><text x="720" y="44">TaHoma box</text>
    <rect x="850" y="20" width="120" height="36" rx="8" fill="#f6f7f9" stroke="#8a949e"/><text x="910" y="44">Motor</text>
  </g>
  <g stroke="#c4cad1" stroke-dasharray="4 4">
    <line x1="90" y1="56" x2="90" y2="576"/>
    <line x1="290" y1="56" x2="290" y2="576"/>
    <line x1="500" y1="56" x2="500" y2="576"/>
    <line x1="720" y1="56" x2="720" y2="576"/>
    <line x1="910" y1="56" x2="910" y2="576"/>
  </g>
  <g font-size="13" fill="#24303c" stroke-width="1.8">
    <line x1="500" y1="96" x2="292" y2="96" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="89" text-anchor="middle">scanNetwork mdns</text>
    <line x1="290" y1="126" x2="498" y2="126" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="119" text-anchor="middle">gateway_pin, IP, port</text>
    <line x1="500" y1="156" x2="718" y2="156" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="149" text-anchor="middle">GET /setup (HTTPS :8443)</text>
    <line x1="720" y1="186" x2="502" y2="186" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="179" text-anchor="middle">devices and states</text>
    <line x1="500" y1="216" x2="718" y2="216" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="209" text-anchor="middle">POST /events/register</text>
    <line x1="500" y1="246" x2="292" y2="246" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="239" text-anchor="middle">discovered devices</text>
    <line x1="90" y1="276" x2="288" y2="276" stroke="#2979d6" marker-end="url(#a)"/><text x="190" y="269" text-anchor="middle">Discover tab: Add</text>
    <line x1="290" y1="306" x2="498" y2="306" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="299" text-anchor="middle">device created</text>
    <line x1="500" y1="336" x2="292" y2="336" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="329" text-anchor="middle">states + badge "local"</text>
    <line x1="90" y1="366" x2="288" y2="366" stroke="#2979d6" marker-end="url(#a)"/><text x="190" y="359" text-anchor="middle">position 30 %</text>
    <line x1="290" y1="396" x2="498" y2="396" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="389" text-anchor="middle">setValue(position, 30)</text>
    <line x1="500" y1="426" x2="718" y2="426" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="419" text-anchor="middle">exec/apply setClosure(70)</text>
    <line x1="720" y1="456" x2="908" y2="456" stroke="#8a949e" marker-end="url(#a)"/><text x="815" y="449" text-anchor="middle">io / RTS radio</text>
    <line x1="500" y1="486" x2="718" y2="486" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="479" text-anchor="middle">POST /events/&lt;id&gt;/fetch (2 s)</text>
    <line x1="720" y1="516" x2="502" y2="516" stroke="#2f9e44" marker-end="url(#a)"/><text x="610" y="509" text-anchor="middle">ClosureState 70</text>
    <line x1="500" y1="546" x2="292" y2="546" stroke="#46505a" marker-end="url(#a)"/><text x="395" y="539" text-anchor="middle">position 30 (changes only)</text>
  </g>
</svg>
