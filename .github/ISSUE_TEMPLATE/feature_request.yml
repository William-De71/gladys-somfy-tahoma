name: Feature request
description: Something the integration could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The use case first (a scene, a dashboard, a device of your box…), then the idea. Give the model of your box and of the device.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Gladys and integration versions
      placeholder: 'Gladys 5.3.0, integration 0.1.0'
